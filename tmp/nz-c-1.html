<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>t</title><style>

  .app { grid-template-columns: minmax(0, 1fr); padding: 6px; height: calc(100vh - var(--player-h) - 58px); }

  body.dock-open .app { grid-template-columns: minmax(0, 1fr); }

  .sidebar { display: none; }

  .right-dock { position: fixed; inset: 6px 6px calc(var(--player-h) + 64px); z-index: 70; grid-column: auto; }

  .mnav { display: grid; bottom: var(--player-h); }

  .tb-search { width: 100%; }

  .tb-search:focus-within { width: 100%; }

 .mnav { display: none !important; }


/* ============================================================
   v0.7 — 2가지 모드
   [기본] 브라우즈 모드: 풀블리드 + 상단 GNB (홈/차트/스토어/일정/아티스트)
   [플레이 모드] 스포티파이 셸: 좌측 라이브러리 + 패널 + 우측 대기열
   ============================================================ */

/* ---------- 기본 = 브라우즈 모드 ---------- */
.app { grid-template-columns: minmax(0, 1fr) 0px; gap: 0; padding: 0; height: 100vh; }

.sidebar { display: none; }

body.has-player .main-panel { padding-bottom: var(--player-h); }

.topbar { padding: 0 var(--gutter); }

.topbar.scrolled { background: rgba(11,12,15,.86); }

.tb-nav { display: none; }

.tb-brand { font-size: 22px; font-weight: 800; letter-spacing: -0.035em; color: var(--accent); text-decoration: none; margin-right: 6px; }

.tb-menu { display: flex; gap: 2px; }

.tb-item { color: var(--ink-muted); text-decoration: none; font-size: 13.5px; font-weight: 600; padding: 7px 13px; border-radius: 8px; transition: color var(--dur-micro), background var(--dur-micro); white-space: nowrap; }

.tb-item:hover { color: var(--ink); background: var(--rule); }

.tb-item.on { color: var(--ink); background: var(--bg-soft); }


/* 브라우즈 모드에서 도크는 떠 있는 오버레이 */
.right-dock {
  position: fixed; right: 14px; top: auto; bottom: calc(var(--player-h) + 12px);
  width: 340px; max-height: min(62vh, 560px); height: auto;
  border: 1px solid var(--rule, rgba(255,255,255,0.055)); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); z-index: 59;
}

body.dock-open .app { grid-template-columns: minmax(0, 1fr) 0px; }


/* ---------- 플레이 모드 ---------- */
body.play-mode .app {
  grid-template-columns: var(--sb-w) minmax(0, 1fr) 0px;
  gap: var(--gap); padding: var(--gap);
  height: calc(100vh - var(--player-h));
}

body.play-mode.dock-open .app { grid-template-columns: var(--sb-w) minmax(0, 1fr) 320px; }

body.play-mode .sidebar { display: flex; }

body.play-mode .main-panel { background: var(--bg-raised); border-radius: var(--radius-lg); padding-bottom: 0; }

body.play-mode .topbar.scrolled { background: rgba(22,23,28,.88); }

body.play-mode .tb-nav { display: flex; }

body.play-mode .tb-brand, body.play-mode .tb-menu { display: none; }

body.play-mode .right-dock {
  position: static; width: auto; max-height: none; height: 100%;
  border: none; box-shadow: none; grid-column: 3; grid-row: 1; z-index: auto;
}


/* 모드 토글 버튼 */
.tbtn.mode.on { color: var(--accent); }

  body.play-mode .app { grid-template-columns: minmax(0, 1fr); }

  body.play-mode .sidebar { display: none; }

  body.play-mode .tb-brand, body.play-mode .tb-menu { display: none; }

  .right-dock { left: 6px; right: 6px; width: auto; }


/* ============================================================
   v0.8 — QA 수정
   ============================================================ */

/* 1) 화이트(스토어) 페이지에서 톱바를 라이트 테마로 전환 */
body.light-page .topbar.scrolled { background: rgba(255,255,255,.9); border-bottom: 1px solid var(--paper-rule); }

body.light-page .tb-item { color: #6b6d74; }

body.light-page .tb-item:hover { color: var(--paper-ink); background: rgba(0,0,0,.05); }

body.light-page .tb-item.on { color: var(--paper-ink); background: rgba(0,0,0,.07); }

body.light-page .tb-search { background: #f0f0f2; }
</style></head><body><div>x</div></body></html>
