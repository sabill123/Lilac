<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>t</title><style>

.modal-box.sheet h3 { font-size: 19px; font-weight: 800; margin-bottom: 14px; }

.modal-box.sheet p { font-size: 13.5px; color: var(--ink-muted); line-height: 1.7; margin-bottom: 10px; }

.modal-box.sheet code { background: var(--bg-soft); border-radius: 4px; padding: 1px 6px; font-size: 12px; }


/* ---------- 토스트 ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--player-h) + 20px); z-index: 110;
  transform: translate(-50%, 12px);
  background: var(--ink); color: var(--bg);
  font-size: 13px; font-weight: 600;
  padding: 11px 20px; border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  opacity: 0; pointer-events: none;
  transition: opacity var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out);
}

.toast.show { opacity: 1; transform: translate(-50%, 0); }


/* ---------- 리빌 ---------- */
.reveal { opacity: 0; transform: translateY(16px); transition: opacity var(--dur-long) var(--ease-out), transform var(--dur-long) var(--ease-out); }

.reveal.on { opacity: 1; transform: none; }

  .gnb { gap: 14px; }

  .gnb-menu { display: none; }

  .gnb-search { width: 170px; }

  .gnb-search:focus-within { width: 200px; }

  .player { grid-template-columns: 1fr auto; }

  .pl-right { display: none; }

  .pl-center { width: 50vw; }

  .chart-list { grid-template-columns: 1fr; }


/* ============ v0.3 추가 컴포넌트 ============ */

/* GNB 계정/지구본 */
.gnb-item.on { color: var(--ink); background: var(--rule); }

.gnb-acct { display: flex; align-items: center; gap: 6px; }

.gnb-signup { background: var(--ink); color: var(--bg); border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 700; text-decoration: none; transition: transform var(--dur-micro); }

.gnb-signup:hover { transform: scale(1.03); }

.gnb-user { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); background: var(--bg-soft); border-radius: 999px; padding: 5px 12px 5px 5px; transition: background var(--dur-micro); }

.gnb-user:hover { background: var(--bg-hover); }

.gnb-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; }

.gnb-credits { font-size: 12px; font-weight: 700; color: var(--ink-muted); }

.globe-wrap { position: relative; }

.tbtn.globe { color: var(--ink-muted); }

.tbtn.globe:hover { color: var(--ink); }

.locale-menu { position: absolute; top: 42px; right: 0; background: var(--bg-soft); border: 1px solid var(--rule, rgba(255,255,255,0.055)); border-radius: var(--radius-md); padding: 6px; min-width: 130px; display: none; box-shadow: var(--shadow-lg); z-index: 60; }

.locale-menu.show { display: block; }

.locale-menu button { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--ink-muted); font-size: 13px; padding: 8px 12px; border-radius: 6px; }

.locale-menu button:hover { background: var(--bg-hover); color: var(--ink); }

.locale-menu button.on { color: var(--accent); font-weight: 700; }


/* 페이지 공통 */
#page { padding-top: 0; }

.page-top { padding-top: calc(var(--gnb-h) + 28px); }

.page-section.narrow { max-width: 980px; }

.sec-link { margin-left: auto; display: inline-flex; align-items: center; gap: 2px; color: var(--ink-faint); font-size: 12.5px; font-weight: 700; text-decoration: none; }

.sec-link:hover { color: var(--ink); }

.sec-link.dark { color: var(--paper-muted); }

.sec-link.dark:hover { color: var(--paper-ink); }

.ic.s { width: 14px; height: 14px; }

.ic.s.flip { transform: rotate(180deg); }

.loading { color: var(--ink-faint); padding: 28px 0; font-size: 13.5px; }
</style></head><body><div>x</div></body></html>
