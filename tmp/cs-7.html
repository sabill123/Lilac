  /* 원근 컨테이너 — 자식이 3D 공간을 공유하게 한다 */
  .d3-stage {
    perspective: 1200px;
    perspective-origin: 50% 40%;
  }

    .d3-rise {
      animation: d3Rise linear both;
      animation-timeline: view();
      animation-range: entry 0% entry 62%;
      transform-origin: 50% 100%;
    }

      from { opacity: 0; transform: perspective(900px) translate3d(0, 28px, -90px) rotateX(9deg); }

      to   { opacity: 1; transform: perspective(900px) translate3d(0, 0, 0) rotateX(0deg); }


    /* 가로 셸프는 옆에서 밀려들어오게 */
    .d3-slide {
      animation: d3Slide linear both;
      animation-timeline: view(inline);
      animation-range: entry 0% entry 50%;
    }

      from { opacity: .35; transform: perspective(800px) translate3d(40px, 0, -60px) rotateY(-7deg); }

      to   { opacity: 1;   transform: none; }


    /* 히어로 — 스크롤에 따라 뒤로 물러나며 흐려진다 */
    .d3-hero {
      animation: d3Hero linear both;
      animation-timeline: view();
      animation-range: exit 0% exit 100%;
      transform-origin: 50% 0%;
    }

      from { transform: perspective(1000px) translateZ(0) rotateX(0deg); opacity: 1; }

      to   { transform: perspective(1000px) translateZ(-120px) rotateX(4deg); opacity: .55; }


    /* 섹션 제목 — 살짝 늦게 따라온다 */
    .d3-head {
      animation: d3Head linear both;
      animation-timeline: view();
      animation-range: entry 0% entry 40%;
    }

      from { opacity: 0; transform: translate3d(0, 14px, 0); }

      to   { opacity: 1; transform: none; }


  /* ── 포인터 3D 틸트 ──────────────────────────────────────
     JS는 --rx / --ry 변수만 갱신하고, 실제 변환은 CSS가 처리한다 */
  .d3-tilt {
    transform: perspective(var(--d3-persp, 760px))
               rotateX(var(--rx, 0deg))
               rotateY(var(--ry, 0deg))
               translateZ(var(--tz, 0px));
    transition: transform 420ms var(--ease-out);
    transform-style: preserve-3d;
  }

  .d3-tilt.is-tilting { transition: transform 90ms linear; }


  /* 카드 안쪽 요소를 Z축으로 띄워 실제 깊이를 만든다 */
  .d3-tilt .d3-layer-1 { transform: translateZ(18px); }

  .d3-tilt .d3-layer-2 { transform: translateZ(34px); }


  /* 광택 — 기울인 방향을 따라 빛이 흐른다 */
  .d3-glare {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0;
    transition: opacity 260ms var(--ease-out);
    background: radial-gradient(
      circle at var(--gx, 50%) var(--gy, 50%),
      rgba(255, 255, 255, 0.26) 0%,
      rgba(255, 255, 255, 0.08) 32%,
      transparent 62%);
  }

  .d3-tilt.is-tilting .d3-glare { opacity: 1; }


  /* ── 차트 순위 3D 스택 ──────────────────────────────────
     상위권일수록 앞으로 나와 보이게 한다 */
  .d3-stack { transform-style: preserve-3d; }

  .d3-stack > * { transition: transform 320ms var(--ease-out); }

  .d3-stack > *:hover { transform: translateZ(22px) scale(1.012); }


  /* ── 페이지 전환 ────────────────────────────────────────*/
  .d3-enter { animation: d3Enter 420ms var(--ease-out) both; }

    from { opacity: 0; transform: perspective(1200px) translate3d(0, 10px, -40px); }

    to   { opacity: 1; transform: none; }

  .d3-rise, .d3-slide, .d3-hero, .d3-head, .d3-enter { animation: none !important; opacity: 1 !important; transform: none !important; }

  .d3-tilt { transform: none !important; }

  .d3-glare { display: none; }

html.touch .d3-tilt { transform: none !important; }

html.touch .d3-glare { display: none; }


/* ── three.js 무대 ────────────────────────────────────────
   캔버스는 배경 레이어로 깔고, 텍스트는 그 위에 얹는다.
   3D가 뜨지 않는 환경에서는 기존 레이아웃이 그대로 유지된다. */

/* 3D 무대는 히어로를 통째로 채운다.
   작게 넣으면 3D인지도 알아보기 어렵고 오히려 어설퍼 보인다. */
.bb-stage {
  position: absolute;
  /* 고정 톱바(70px) 아래에서 시작한다 */
  inset: 70px 0 0 0;
  z-index: 1;
  pointer-events: auto;
  opacity: 0;
  transition: opacity 1100ms var(--ease-out);
}

.bb-stage canvas { opacity: 0.96; }

body.has-3d-hero .bb-stage { opacity: 1; }

/* 3D가 뜨면 기존 정적 레이어는 자리를 내준다.
   블러 배경과 스크림을 그대로 두면 3D가 뿌옇게 묻힌다. */
body.has-3d-hero .bb-card { opacity: 0; pointer-events: none; }

body.has-3d-hero .bb-blur { opacity: 0.14; filter: blur(80px) saturate(1.4); }

body.has-3d-hero .bb-scrim {
  background: linear-gradient(to top, var(--page) 0%, rgba(5, 6, 8, 0.2) 16%, transparent 38%);
}

/* 텍스트가 캔버스에 묻히지 않도록 */
section.billboard .bb-inner { position: relative; z-index: 2; }

/* 텍스트가 앨범 위에서도 읽히도록 왼쪽에 그라데이션 막을 깐다 */
/* 텍스트 뒤에만 어둡게 깔고, 재킷은 최대한 살린다.
   전체를 덮으면 갤러리 벽이 통째로 묻혀 3D를 넣은 의미가 없어진다. */
body.has-3d-hero .bb-inner::before {
  content: '';
  position: absolute;
  inset: -30% -14% -30% -14%;
  z-index: -1;
  pointer-events: none;
  /* 제목·버튼이 놓이는 왼쪽 40%는 확실히 눌러 글자가 깨끗하게 읽히게 한다 */
  background: linear-gradient(90deg,
    rgba(5, 6, 8, 0.94) 0%, rgba(5, 6, 8, 0.82) 30%,
    rgba(5, 6, 8, 0.38) 52%, transparent 70%);
}

body.has-3d-hero .bb-content { text-shadow: 0 2px 28px rgba(0, 0, 0, 0.7); }

/* 3D가 뜨면 히어로를 화면 높이만큼 키워 몰입감을 준다 */
body.has-3d-hero section.billboard {
  min-height: min(86vh, 780px);
  align-items: center;
}

/* 아래로 이어지는 섹션과 자연스럽게 연결 */
body.has-3d-hero section.billboard::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 30%;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(transparent, var(--page));
}


/* 차트 무대도 히어로 전체를 쓴다. 텍스트는 왼쪽 막 위에 얹는다. */
.ch-stage {
  position: absolute;
  /* 톱바(고정 70px) 아래에서 시작하고, 하단 컨트롤과도 떨어뜨린다 */
  inset: 88px 3% 84px 48%;
  z-index: 1;
  opacity: 0;
  transition: opacity 1100ms var(--ease-out);
}

body.has-3d-chart .ch-stage { opacity: 1; }

.chart-hero { position: relative; overflow: hidden; }

.chart-hero .ch-inner { position: relative; z-index: 2; }

/* 컨트롤 뒤에 옅은 판을 깔아 3D와 겹쳐도 읽히게 한다 */
body.has-3d-chart .ch-controls {
  position: relative;
  z-index: 3;
}

/* 컨트롤과 무대가 겹치지 않으므로 별도 배경이 필요 없다 */
body.has-3d-chart .chart-hero {
  /* 1위 한 점만 전시하므로 히어로가 클 필요가 없다.
     예전엔 여러 작품을 걸어 62vh를 썼는데, 지금은 컨트롤 아래 빈 공간만 생긴다. */
  min-height: min(48vh, 430px);
  display: flex;
  align-items: center;
  padding-top: 28px;
}

/* 무대가 오른쪽에만 있으므로 텍스트를 덮는 막은 두지 않는다 */
body.has-3d-chart .chart-hero::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 26%;
  z-index: 2;
  pointer-events: none;
  background: linear-gradient(transparent, var(--page));
}


/* 3D 열에서 현재 맨 앞에 온 곡 */
.ch-now {
  display: inline-flex;
  align-items: center;
  gap: 10px;

/* 3D 조작 안내 — 처음 보는 사람은 드래그할 수 있다는 걸 모른다 */
.stage-hint {
  position: absolute;

  .bb-stage, .ch-stage { display: none; }

/* ═══ 보관함 재설계 ═══════════════════════════════════════
   기존에는 플레이리스트·아티스트·좋아요가 한 목록에 섞여 있어
   "무엇이 있는지"는 보여도 "무엇을 할지"가 보이지 않았다.
   목적이 다른 것을 섹션으로 나누고, 가장 자주 하는 행동(이어 듣기)을 맨 위에 둔다. */

.lib2 { padding: 0 var(--gutter) 80px; max-width: 1500px; margin: 0 auto; }


/* ── 헤더: 요약을 숫자로 먼저 보여준다 ── */
.lib2-hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
  padding: 44px 0 26px;
}

.lib2-title { font-size: clamp(30px, 4vw, 46px); font-weight: 800; letter-spacing: -0.03em; margin: 6px 0 8px; }

.lib2-sub { color: var(--ink-muted); font-size: 14px; }

.lib2-stats { display: flex; gap: 8px; flex-wrap: wrap; }

.lib2-stats > div {
  min-width: 96px;
  padding: 12px 16px;
  border-radius: var(--radius-lg);
  background: var(--bg-raised);
  box-shadow: var(--hairline);
}

.lib2-stats dt { font-size: 11px; color: var(--ink-faint); margin-bottom: 4px; }

.lib2-stats dd { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }


/* ── 툴바 ── */
.lib2-bar {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  padding: 12px 0;
  background: linear-gradient(var(--page) 72%, transparent);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.lib2-tabs { display: flex; gap: 6px; flex-wrap: wrap; }

.lib2-tools { display: flex; align-items: center; gap: 8px; }


/* ── 이어 듣기 ── */
.lib2-sec { margin-top: 30px; }

.sec-count {
  margin-left: 6px;
  padding: 1px 7px;
  border-radius: 999px;
  background: var(--bg-soft);
  color: var(--ink-muted);
  font-size: 12px;
  font-weight: 700;
  vertical-align: 2px;
}

.lib2-continue {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
  gap: 10px;
}

.lc-cont {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 14px 0 0;
  border: 0;
  border-radius: var(--radius-md);
  background: var(--bg-raised);
  box-shadow: var(--hairline);
  color: inherit;
  text-align: left;
  overflow: hidden;
  cursor: pointer;
  transition: background var(--dur-micro) var(--ease-out);
}

.lc-cont:hover { background: var(--bg-soft); }

.lc-cont-art { flex: 0 0 auto; width: 62px; height: 62px; background: var(--bg-soft); }

.lc-cont-art img { width: 100%; height: 100%; object-fit: cover; display: block; }

.lc-cont-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.lc-cont-txt b { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.lc-cont-txt span { font-size: 12px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.lc-cont-play {
  flex: 0 0 auto;
  display: grid; place-items: center;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-ink);
  opacity: 0;

  ::view-transition-old(root) {

  ::view-transition-old(lilac-topbar), ::view-transition-new(lilac-topbar),
