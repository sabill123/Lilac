<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>t</title><style>

  .focus-shell { padding: 48px 14px 70px; }

  .focus-head { margin-bottom: 30px; }

  .focus-head h1 { font-size: 40px; }

  .focus-head > div > p:last-child { font-size: 13px; }

  .focus-player-card, .focus-curator { border-radius: 18px; }

  .focus-video { min-height: 200px; }

  .focus-now { align-items: flex-start; }

  .focus-actions { grid-template-columns: 1fr; }

  .focus-volume { grid-template-columns: 18px 1fr 40px; }

  .focus-curator { display: block; padding: 24px 18px; }

  .focus-mode-row, .focus-duration-row { display: grid; }

  .focus-sec-head { display: block; }

  .focus-sec-head > p { margin-top: 12px; text-align: left; }

  .focus-mix { grid-template-columns: 90px 1fr; }

  .focus-energy { left: 116px; }

  .focus-native-sec { grid-template-columns: 1fr; padding: 25px 18px; border-radius: 20px; }

  .focus-native-points { grid-column: auto; grid-template-columns: 1fr; }


/* ============================================================
   Lilac 2026 — editorial shell + separate work mode
   ============================================================ */
:root {
  --bg: #08090c;
  --bg-raised: #111218;
  --bg-soft: #1a1b22;
  --bg-hover: #23242c;
  --ink: #f5f4f7;
  --ink-muted: #a5a2ad;
  --ink-faint: #706d77;
  --rule: rgba(255,255,255,.075);
  --rule-strong: rgba(255,255,255,.15);
  --accent: #6D4A85;
  --accent-rgb: 109 74 133;
  --accent-hover: #573A6B;
  --gnb-h: 72px;
  --tb-h: 72px;
  --gutter: clamp(22px, 3.2vw, 52px);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
}


body { font-size: 15px; background: #050609; }

#backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .32; }

#backdrop canvas { opacity: .72; mix-blend-mode: screen; mask-image: radial-gradient(circle at 64% 16%, #000 0, rgba(0,0,0,.78) 30%, transparent 74%); }

.app { position: relative; z-index: 1; }

.app { background: rgba(5,6,9,.88); }

.main-panel { background: rgba(8,9,12,.92); }


/* Header: content navigation and work entry use different visual groups. */
.topbar {
  gap: 20px;
  padding: 0 var(--gutter);
  border-bottom: 1px solid transparent;
}

.topbar.scrolled { background: rgba(8,9,12,.84); border-bottom-color: var(--rule); }

.tb-brand { margin-right: 12px; font-size: 24px; font-weight: 760; color: var(--accent); }

.tb-menu { gap: 3px; }

.tb-item { padding: 9px 13px; border-radius: 10px; font-size: 14px; font-weight: 560; }

.tb-item.on { background: rgba(255,255,255,.075); }

.tb-search { height: 42px; width: min(27vw, 360px); border: 1px solid rgba(255,255,255,.055); background: rgba(255,255,255,.065); }

.tb-search:focus-within { width: min(30vw, 410px); outline: 1px solid rgba(255,255,255,.7); outline-offset: 0; }

.tb-right { gap: 9px; }

.tb-work {
  display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 15px;
  color: #ece8f6; text-decoration: none; white-space: nowrap; font-size: 13px; font-weight: 660;
   border-radius: 12px; background: rgb(var(--accent-rgb) / .09);
  transition: background .2s, border-color .2s, transform .2s;
}

.tb-work::before { content: ''; width: 1px; height: 22px; margin-left: -25px; margin-right: 9px; background: var(--rule-strong); }

.tb-work .ic { width: 16px; height: 16px; color: var(--accent-hover); }

.tb-work:hover { transform: translateY(-1px); border-color: rgb(var(--accent-rgb) / .65); background: rgb(var(--accent-rgb) / .16); }

.work-page .tb-work { border-color: rgba(255,255,255,.14); background: rgba(255,255,255,.055); }

.tb-connect { height: 40px; border-radius: 12px; }

.tb-icon, .tb-user { background: rgba(255,255,255,.055); }

.tb-signup { border-radius: 11px; padding: 10px 16px; }
