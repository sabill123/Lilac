<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>t</title><style>

.np-full.toned { background: radial-gradient(120% 90% at 50% 0%, rgba(var(--hdr), .55) 0%, rgba(var(--hdr), .16) 45%, var(--bg) 78%); }

.np-close { position: absolute; top: 26px; right: 26px; width: 42px; height: 42px; border-radius: 50%; border: none; background: rgba(0,0,0,.4); color: var(--ink); display: flex; align-items: center; justify-content: center; }

.np-close:hover { background: rgba(0,0,0,.7); }

.np-stage { display: flex; flex-direction: column; align-items: center; gap: 40px; perspective: 1200px; }

.np-disc { position: relative; width: min(46vh, 380px); aspect-ratio: 1; transform-style: preserve-3d; animation: floaty 7s ease-in-out infinite; }
 0%, 100% { transform: rotateX(8deg) rotateY(-6deg) translateY(0); }
 50% { transform: rotateX(4deg) rotateY(6deg) translateY(-14px); }

.np-cover { width: 100%; height: 100%; border-radius: 10px; background-size: cover; background-position: center; background-color: var(--bg-soft); box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,.07); }

.np-disc::after { content: ''; position: absolute; inset: 10% -22% 10% auto; width: 80%; border-radius: 50%; background: radial-gradient(circle at 50% 50%, #101116 0 24%, #191a21 24% 25%, #101116 25% 40%, #191a21 40% 41%, #101116 41%); transform: translateZ(-30px) translateX(24%); box-shadow: var(--shadow-lg); }

body.playing .np-full.show .np-disc::after { animation: spin 6s linear infinite; }

.np-text { text-align: center; }

.np-label { font-size: 12px; font-weight: 800; letter-spacing: .2em; color: var(--ink-muted); }

.np-text h2 { font-size: clamp(28px, 4.6vw, 52px); font-weight: 800; letter-spacing: -0.04em; margin: 12px 0 8px; }

.np-text p { font-size: 17px; color: var(--ink-muted); }


/* ---------- 3D 틸트 ---------- */
[data-tilt] { transform: perspective(760px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateZ(0); transform-style: preserve-3d; transition: transform var(--dur-short) var(--ease-out); }

[data-tilt]:hover { transition: transform 90ms linear; }

.card[data-tilt]:hover { transform: perspective(760px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-4px); }

.glare { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: 0; transition: opacity var(--dur-short); background: radial-gradient(circle at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.34), transparent 46%); mix-blend-mode: overlay; }

[data-tilt]:hover .glare { opacity: 1; }

.bb-card { transform: perspective(900px) rotateX(var(--rx, 2deg)) rotateY(var(--ry, -6deg)); position: relative; }

.bb-card:hover { transform: perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.03); }


/* ---------- 넷플릭스식 호버 확장 ---------- */
.card { position: relative; }

.card.expanded { z-index: 20; }

.card.expanded .cover { transform: scale(1.14); box-shadow: var(--shadow-lg); }

.card .cover { transform-origin: center bottom; transition: transform var(--dur-long) var(--ease-out), box-shadow var(--dur-short); }

.card.round.expanded .cover { transform: scale(1.1); }


/* ---------- 리플 ---------- */
.ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.35); transform: scale(0); animation: rip .6s var(--ease-out) forwards; pointer-events: none; }
 to { transform: scale(1); opacity: 0; }

.btn-pill, .play-big, .btn-play-w, .btn-buy, .chip, .seg-btn { position: relative; overflow: hidden; }


/* ---------- 컨텍스트 메뉴 ---------- */
.ctx { position: fixed; z-index: 200; min-width: 210px; background: var(--bg-soft); border: 1px solid var(--rule, rgba(255,255,255,0.055)); border-radius: var(--radius-md); padding: 5px; box-shadow: var(--shadow-lg); opacity: 0; transform: scale(.96) translateY(-4px); pointer-events: none; transform-origin: top left; transition: opacity var(--dur-micro), transform var(--dur-micro); }

.ctx.show { opacity: 1; transform: none; pointer-events: auto; }

.ctx-i { display: flex; align-items: center; gap: 11px; width: 100%; background: none; border: none; color: var(--ink); font-family: inherit; font-size: 13.5px; font-weight: 600; padding: 10px 12px; border-radius: var(--radius-sm); text-align: left; }

.ctx-i:hover { background: var(--bg-hover); }

.ctx-i.danger { color: #ff6b6e; }

.ctx-i .ic { color: var(--ink-muted); }


/* ---------- 큐 드래그 ---------- */
.q-row { grid-template-columns: auto; }

.q-grip { color: var(--ink-faint); opacity: 0; cursor: grab; display: flex; flex-shrink: 0; }

.q-row:hover .q-grip { opacity: 1; }

.q-row.dragging { opacity: .4; }

.q-row.drop-tgt { box-shadow: inset 0 2px 0 var(--accent); }

.empty-box.sm { padding: 32px 16px; }
</style></head><body><div>x</div></body></html>
