<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>t</title><style>

  .footer { padding: 24px var(--gutter) 28px; }

  /* 플레이어 축소 */
  .player { height: var(--player-h); padding: 0 10px; grid-template-columns: 1fr auto; gap: 10px; }

  .pl-artwrap, .pl-art { width: 44px; height: 44px; }

  .pl-title { font-size: 12.5px; }

  .pl-artist { font-size: 11px; }

  .pl-left .tbtn, .pl-progress, #btnShuffle, #btnRepeat { display: none; }

  .pl-center { width: auto; }

  .pl-transport { gap: 8px; }

  .tbtn.main { width: 40px; height: 40px; }

  .pl-right { display: flex; gap: 2px; }

  .pl-right .vol, .pl-vol { display: none; }

  .np-stage { gap: 26px; }

  .np-disc { width: min(64vw, 300px); }

  .np-text h2 { font-size: 26px; }

  .modal-box.sheet { padding: 24px; }

  .ctx { min-width: 180px; }

  /* 1) 톱바가 넘치지 않도록 3분할 재배치 */
  .topbar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; padding: 0 12px; }

  .tb-brand { grid-column: 1; }

  .tb-search { grid-column: 2; width: 100%; min-width: 0; }

  .tb-search:focus-within { width: 100%; }

  .tb-right { grid-column: 3; margin-left: 0; flex-shrink: 0; }

  .tb-credits { display: none; }
          /* 아바타만 노출 */
  .tb-user { padding: 3px; }

  .tb-icon { width: 34px; height: 34px; }

  body.play-mode .tb-nav { display: none; }


  /* 2) 표는 가로 스크롤 컨테이너로 */
  .mp-section:has(.mp-table) { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  .mp-table { min-width: 620px; }


  /* 3) 터치 타깃 최소 크기 확보 */
  .tbtn, .t-a, .rk-mv, .view-toggle, .tb-arrow, .modal-x, .q-x, .sb-add { min-width: 36px; min-height: 36px; }

  .t-a { padding: 9px; opacity: 1; }
       /* 모바일은 호버가 없으므로 상시 노출 */
  .t-acts { gap: 0; }

  .rk-mv { padding: 10px; }


  /* 4) 트랙 테이블 모바일 간소화 */
  .sp-table { --cols: 26px 1fr 82px; }

  .sp-table.no-al, .sp-table.no-dt, .sp-table.no-al.no-dt { --cols: 26px 1fr 82px; }

  .t-head .t-du, .t-row .t-du { display: none; }

  .t-head { font-size: 11px; }

  .t-row { height: 60px; padding-right: 4px; }

  .t-title img { width: 44px; height: 44px; }


  /* 5) 스티키 헤더는 모바일에서 해제(공간 절약) */
  .sp-table.sticky .t-head { position: static; margin: 0; padding: 0 4px; }


  /* 6) 컨텍스트 메뉴가 화면 밖으로 나가지 않도록 */
  .ctx { max-width: calc(100vw - 24px); }


/* 플레이 모드 홈: 바로 가기 타일 (스포티파이 홈 시그니처) */
.quick-sec { padding-top: calc(var(--tb-h) + 8px); }

.quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }

.quick { position: relative; display: flex; align-items: center; gap: 14px; background: rgba(255,255,255,.06); border-radius: var(--radius-sm); overflow: hidden; text-decoration: none; color: var(--ink); transition: background var(--dur-micro); }

.quick:hover { background: rgba(255,255,255,.12); }

.quick-art { width: 62px; height: 62px; background-size: cover; background-position: center; background-color: var(--bg-soft); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

.quick-art.liked { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; }

.quick b { font-size: 14.5px; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.quick-play { position: absolute; right: 12px; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(6px); transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), opacity var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out); box-shadow: var(--shadow-md); }

.quick:hover .quick-play { opacity: 1; transform: none; }

body:not(.play-mode) .quick-sec { display: none; }
 .quick-grid { grid-template-columns: 1fr 1fr; }
 .quick b { font-size: 12.5px; }
 .quick-art { width: 52px; height: 52px; }
 .quick-play { display: none; }


/* ============================================================
   v1.0 — 검색 강화 · 디스코그래피 · 캘린더 · 상품 상세 탭
   ============================================================ */

/* ---------- 검색 ---------- */
.sr-top { display: grid; grid-template-columns: minmax(260px, 380px) 1fr; gap: 24px; margin-bottom: 34px; }

.sr-topcard { position: relative; background: var(--bg-raised); border-radius: var(--radius-md); padding: 22px; cursor: pointer; transition: background var(--dur-short); overflow: hidden; }

.sr-topcard:hover { background: var(--bg-soft); }

.sr-toplabel { font-size: 12px; font-weight: 700; color: var(--ink-muted); margin-bottom: 14px; }

.sr-topcard img { width: 96px; height: 96px; border-radius: 6px; object-fit: cover; box-shadow: var(--shadow-md); display: block; }

.sr-topcard h3 { font-size: 26px; font-weight: 800; letter-spacing: -0.03em; margin: 16px 0 8px; line-height: 1.2; }

.sr-topcard p { font-size: 13px; color: var(--ink-muted); display: flex; align-items: center; gap: 8px; }

.sr-kind { background: var(--bg-hover); color: var(--ink); font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }

.sr-topcard .play-big { position: absolute; right: 20px; bottom: 20px; opacity: 0; transform: translateY(8px); transition: background-color var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out), opacity var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out); }

.sr-topcard:hover .play-big { opacity: 1; transform: none; }

.sr-golink { display: inline-flex; align-items: center; gap: 4px; margin-top: 14px; font-size: 12.5px; font-weight: 700; color: var(--accent); text-decoration: none; }

.sr-h { font-size: 17px; font-weight: 800; margin-bottom: 10px; }

.sr-sec { margin: 30px 0 14px; }
 .sr-top { grid-template-columns: 1fr; }


/* ---------- 아티스트 정보 ---------- */
.ar-about { display: grid; grid-template-columns: 260px 1fr; gap: 28px; align-items: start; }

.ar-about-img { aspect-ratio: 1; border-radius: var(--radius-md); background: var(--bg-soft); background-size: cover; background-position: center; box-shadow: var(--shadow-lg); }

.ar-about-txt p { font-size: 14px; color: var(--ink-muted); line-height: 1.75; margin-bottom: 12px; max-width: 620px; }

.ar-listeners { font-size: 15px !important; color: var(--ink) !important; }

.ar-listeners b { font-variant-numeric: tabular-nums; }

.ar-about-txt .btn-out { margin-top: 6px; }
 .ar-about { grid-template-columns: 1fr; gap: 18px; }
 .ar-about-img { max-width: 200px; }


/* ---------- 일정: 캘린더 ---------- */
.sch-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-top: 20px; }

.sch-toolbar .chips { margin-top: 0; }

.cal-month { margin-bottom: 34px; }

.cal-title { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 14px; }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }

.cal-w { text-align: center; font-size: 11.5px; font-weight: 700; color: var(--ink-faint); padding-bottom: 6px; }

.cal-w.sun { color: #ff6b6e; }

.cal-cell { min-height: 92px; border-radius: var(--radius-sm); background: var(--bg-raised); border: 1px solid var(--rule, rgba(255,255,255,0.055)); padding: 7px 8px; display: flex; flex-direction: column; gap: 5px; }

.cal-cell.empty { background: transparent; border-color: transparent; }

.cal-cell.has { border-color: rgb(var(--accent-rgb) / .4); }

.cal-cell.today { box-shadow: inset 0 0 0 1.5px var(--accent); }

.cal-d { font-size: 12px; font-weight: 700; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

.cal-cell.today .cal-d { color: var(--accent); }

.cal-ev { background: rgb(var(--accent-rgb) / .16); border-radius: 5px; padding: 5px 7px; cursor: pointer; transition: background var(--dur-micro); overflow: hidden; }

.cal-ev:hover { background: rgb(var(--accent-rgb) / .3); }

.cal-ev b { display: block; font-size: 11px; font-weight: 800; color: var(--accent); }

.cal-ev span { display: block; font-size: 11px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .cal-cell { min-height: 62px; padding: 5px; }

  .cal-ev span { display: none; }

  .cal-ev { padding: 3px 5px; }

  .cal-grid { gap: 4px; }


/* ---------- 상품 상세 탭 ---------- */
.pd-tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--paper-rule); margin-top: 52px; }

.pd-tab { background: none; border: none; font-family: inherit; font-size: 14px; font-weight: 700; color: var(--paper-muted); padding: 0 0 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; }

.pd-tab:hover { color: var(--paper-ink); }

.pd-tab.on { color: var(--paper-ink); border-bottom-color: var(--paper-ink); }

.pd-panel { padding: 26px 0 8px; color: #55585f; font-size: 13.5px; line-height: 1.8; }

.pd-panel p { max-width: 720px; margin-bottom: 14px; }

.pd-spec { width: 100%; max-width: 640px; border-top: 1px solid var(--paper-rule); border-collapse: collapse; margin-top: 18px; }

.pd-spec th, .pd-spec td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--paper-rule); font-size: 13px; }

.pd-spec th { width: 140px; color: var(--paper-muted); font-weight: 600; background: #fafafb; }

.pd-spec td { color: var(--paper-ink); }

.pd-ul { list-style: none; max-width: 720px; }

.pd-ul li { position: relative; padding: 7px 0 7px 16px; }

.pd-ul li::before { content: ''; position: absolute; left: 0; top: 15px; width: 4px; height: 4px; border-radius: 50%; background: var(--paper-muted); }

.pd-ul li.dim { color: var(--paper-muted); font-size: 12.5px; }

.pd-panel .pd-actions { margin-top: 18px; }
 .pd-tabs { gap: 18px; margin-top: 34px; }
 .pd-tab { font-size: 13px; }
 .pd-spec th { width: 96px; }


/* ============================================================
   v1.1 — 실데이터 연동 표기
   ============================================================ */
.src-badge { font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }

.src-badge.real { background: rgba(103,232,249,.14); color: #67e8f9; }

.src-badge.demo { background: rgba(255,255,255,.08); color: var(--ink-faint); }

.live-badge { font-size: 11px; font-weight: 800; padding: 2px 9px; border-radius: 999px; background: rgba(255,255,255,.08); color: var(--ink-faint); margin-left: 6px; }

.live-badge.on { background: rgba(229,72,77,.16); color: #ff6b6e; }

.live-badge.on::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #ff6b6e; margin-right: 5px; vertical-align: middle; animation: pulse 1.6s ease-in-out infinite; }

.stat-sk { display: inline-block; width: 190px; height: 13px; border-radius: 4px; background: linear-gradient(90deg, rgba(255,255,255,.06) 25%, rgba(255,255,255,.13) 37%, rgba(255,255,255,.06) 63%); background-size: 200% 100%; animation: shimmer 1.25s linear infinite; vertical-align: middle; }

.sch-go.ext { display: flex; color: var(--ink-faint); text-decoration: none; }

.sch-go.ext:hover { color: var(--ink); }

.sch-top { flex-wrap: wrap; }

.chart-live { display: inline-flex; align-items: center; gap: 6px; }


/* ============================================================
   v1.2 — 플레이 모드 = 전 페이지 스포티파이 디자인
   ============================================================ */

/* 홈 */
.home-play { padding-top: calc(var(--tb-h) + 16px); }

.greet { font-size: clamp(26px, 3.4vw, 34px); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 20px; }

.sp-title.plain { cursor: default; }

.sp-title.plain:hover { text-decoration: none; }


/* 세그먼트(작은 버전) · 다크 셀렉트 */
.seg.small { margin-top: 0; margin-left: auto; padding: 3px; }

.seg.small .seg-btn { padding: 7px 16px; font-size: 12.5px; }

.dark-select { background: var(--bg-soft); border: none; color: var(--ink); font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 9px 14px; border-radius: 999px; margin-left: auto; }


/* 스토어: 플레이 모드에선 다크 */
body.play-mode .store-wrap { background: transparent; color: var(--ink); margin-top: 0; }

body.play-mode .store-inner { padding: 0 var(--gutter) 40px; }

  background: var(--bg-soft); border-color: var(--rule-strong); color: var(--ink);
}

body.play-mode .pd-img { background: var(--bg-raised); border-radius: var(--radius-md); }

body.play-mode .btn-buy { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0 28px; font-weight: 800; }

body.play-mode .store-nav { border-bottom-color: var(--rule); }

body.play-mode .sn-item { color: var(--ink-muted); }

body.play-mode .sn-item.on { color: var(--ink); border-bottom-color: var(--accent); }


/* 일정: 플레이 모드는 스포티파이 톤 */

body.play-mode .sch-row:hover { background: var(--bg-soft); transform: none; }

/* 계정: 플레이 모드에선 카드 톤 정리 */

body.play-mode .mp-card.accent { background: linear-gradient(135deg, rgb(var(--accent-rgb) / .2), rgba(255,255,255,.03)); }


/* 플레이 모드 공통: 페이지 상단 여백 */

body.play-mode .lib-page { padding-top: 20px; }


/* ============================================================
   v1.3 — 사이드바 재설계 (스포티파이 실물 기준)
   ============================================================ */
:root { --sb-w: 296px; --sb-w-min: 76px; }


body.sb-collapsed .app { grid-template-columns: var(--sb-w-min) minmax(0, 1fr) 0px; }

body.sb-collapsed.dock-open .app { grid-template-columns: var(--sb-w-min) minmax(0, 1fr) 320px; }


/* --- 상단 내비 패널 --- */
.sb-top { background: var(--bg-raised); border-radius: var(--radius-lg); padding: 8px 12px; }

.sb-nav { display: flex; flex-direction: column; gap: 0; }

.sb-item {
  display: flex; align-items: center; gap: 18px;
  height: 46px; padding: 0 12px; border-radius: var(--radius-sm);
  color: var(--ink-muted); text-decoration: none;
  font-size: 15px; font-weight: 700; letter-spacing: -0.01em;
  transition: color var(--dur-micro);
}

.sb-item .ic { width: 24px; height: 24px; flex-shrink: 0; }

.sb-item:hover { color: var(--ink); }

.sb-item.on { color: var(--ink); background: transparent; }

.sb-item.on .ic { color: var(--accent); }


/* --- 보관함 패널 --- */
.sb-lib { background: var(--bg-raised); border-radius: var(--radius-lg); padding: 8px 4px 8px 8px; }

.sb-lib-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 4px 4px; height: 48px; }

.sb-lib-title {
  display: flex; align-items: center; gap: 16px; background: none; border: none;
  color: var(--ink-muted); font-family: inherit; font-size: 15px; font-weight: 700;
  padding: 8px; border-radius: var(--radius-sm); transition: color var(--dur-micro);
}

.sb-lib-title .ic { width: 24px; height: 24px; }

.sb-head-btns { display: flex; align-items: center; gap: 2px; }

.sb-icon {
  width: 32px; height: 32px; border: none; border-radius: 50%; background: transparent;
  color: var(--ink-muted); display: flex; align-items: center; justify-content: center;
  transition: background-color var(--dur-micro), border-color var(--dur-micro), color var(--dur-micro), opacity var(--dur-micro), transform var(--dur-micro), box-shadow var(--dur-micro); text-decoration: none;
}

.sb-icon:hover { background: rgba(255,255,255,.08); color: var(--ink); transform: scale(1.05); }

.sb-chips::-webkit-scrollbar { display: none; }

  border: none; background: rgba(255,255,255,.07); color: var(--ink);
  font-family: inherit; font-size: 13px; font-weight: 500;
  padding: 6px 12px; border-radius: 999px; white-space: nowrap;
  transition: background var(--dur-micro);
}

.sb-chip:hover { background: rgba(255,255,255,.13); }

.sb-chip.on { background: var(--ink); color: var(--bg); font-weight: 600; }


/* 검색 / 정렬 툴바 */
.sb-tools { display: flex; align-items: center; gap: 6px; padding: 0 8px 8px; }

.sb-find-btn {
  width: 32px; height: 32px; border: none; border-radius: 50%; background: transparent;
  color: var(--ink-muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: background-color var(--dur-micro), border-color var(--dur-micro), color var(--dur-micro), opacity var(--dur-micro), transform var(--dur-micro), box-shadow var(--dur-micro);
}

.sb-find-btn:hover { background: rgba(255,255,255,.08); color: var(--ink); }

.sb-find-btn .ic { width: 16px; height: 16px; }

.sb-find {
  flex: 1; min-width: 0; width: 0; padding: 0; opacity: 0; pointer-events: none;
  background: rgba(255,255,255,.08); border: none; border-radius: 4px;
  color: var(--ink); font-family: inherit; font-size: 13px; height: 32px;
  transition: opacity var(--dur-short);
}

.sb-tools.open .sb-find { width: auto; opacity: 1; pointer-events: auto; padding: 0 10px; }

.sb-tools.open .sb-find-btn { display: none; }

.sb-sort {
  margin-left: auto; display: inline-flex; align-items: center; gap: 5px;
  border: none; background: transparent; color: var(--ink-muted);
  font-family: inherit; font-size: 12.5px; font-weight: 600;
  padding: 6px 8px; border-radius: 4px; white-space: nowrap; flex-shrink: 0;
  transition: color var(--dur-micro);
}

.sb-sort:hover { color: var(--ink); }

.sb-sort .ic { width: 14px; height: 14px; }


/* 리스트 */
.sb-list { overflow-y: auto; padding: 0 4px 4px; }

.sb-row {
  position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto;
  align-items: center; gap: 12px; padding: 8px; border-radius: var(--radius-sm);
  text-decoration: none; color: var(--ink); transition: background var(--dur-micro);
}

.sb-row:hover { background: rgba(255,255,255,.07); }

.sb-row.on { background: rgba(255,255,255,.11); }

.sb-cover {
  position: relative; width: 48px; height: 48px; border-radius: 4px; flex-shrink: 0;
  background: var(--bg-soft); background-size: cover; background-position: center;
  display: flex; align-items: center; justify-content: center; color: var(--ink-faint);
  overflow: hidden;
}

.sb-row.round .sb-cover { border-radius: 50%; }

.sb-cover.liked { background: linear-gradient(135deg, var(--accent), var(--accent-deep)); color: #fff; }

.sb-play {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.6); opacity: 0; transition: opacity var(--dur-micro);
}

.sb-play .ic { width: 18px; height: 18px; color: #fff; }

.sb-row:hover .sb-play { opacity: 1; }

.sb-meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }

.sb-meta b { font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sb-meta i { font-size: 12.5px; font-style: normal; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.sb-row.on .sb-meta b, .sb-row.playing .sb-meta b { color: var(--accent); }

.sb-eq { display: none; }

.sb-row.playing .sb-eq { display: block; }


/* 빈 상태 */
.sb-empty { padding: 22px 12px; text-align: center; color: var(--ink-faint); }

.sb-empty .ic { width: 26px; height: 26px; margin-bottom: 10px; }

.sb-empty p { font-size: 13px; margin-bottom: 12px; }

.sb-empty-btn {
  border: none; background: var(--ink); color: var(--bg); font-family: inherit;
  font-size: 12.5px; font-weight: 700; padding: 8px 16px; border-radius: 999px;
}


/* --- 접힌 상태 --- */
body.sb-collapsed .sb-item { justify-content: center; gap: 0; padding: 0; }

body.sb-collapsed .sb-item span { display: none; }

body.sb-collapsed .sb-lib-title b,
body.sb-collapsed .sb-chips,
body.sb-collapsed .sb-tools,
body.sb-collapsed .sb-meta,
body.sb-collapsed .sb-head-btns a { display: none; }

body.sb-collapsed .sb-lib-head { justify-content: center; padding: 4px; }

body.sb-collapsed .sb-lib-title { padding: 8px; gap: 0; }

body.sb-collapsed .sb-row { grid-template-columns: 48px; justify-content: center; padding: 8px 0; }

body.sb-collapsed .sb-lib { padding: 8px 6px; }

body.sb-collapsed .sb-top { padding: 8px 6px; }

body.sb-collapsed .sb-empty p, body.sb-collapsed .sb-empty-btn { display: none; }


/* 스크롤바 */
.sb-list::-webkit-scrollbar { width: 8px; }

.sb-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.14); border-radius: 8px; }
