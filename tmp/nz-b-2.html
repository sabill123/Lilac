<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>t</title><style>

.bb-actions { margin-top: 28px; }

.bb-card { width: clamp(200px, 24vw, 300px); aspect-ratio: 1; border-radius: 6px; overflow: hidden; box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,.06); transform: rotate(-1.5deg); transition: transform var(--dur-long) var(--ease-out); }

 100% { background-position: -200% 0; }

.sk-tt { display: flex; flex-direction: column; gap: 7px; }

.sk-l1 { width: 42%; height: 13px; }

.sk-l2 { width: 24%; height: 11px; margin-top: 6px; }

.card .cover.sk { aspect-ratio: 1; }


/* ---------- 빈 상태 ---------- */
.empty-box { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 56px 20px; border: 1px dashed var(--rule-strong, rgba(255,255,255,0.13)); border-radius: var(--radius-lg); }

.empty-box span { font-size: 13px; color: var(--ink-faint); margin-top: 6px; }

/* ---------- GNB 스크롤 반응 ---------- */
.gnb { background: transparent; border-bottom-color: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; transition: background var(--dur-short), border-color var(--dur-short), backdrop-filter var(--dur-short); }

.gnb.scrolled { background: rgba(11,12,15,.88); border-bottom-color: var(--rule); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); }
 from { opacity: 0; transform: translateY(10px); }
 to { opacity: 1; transform: none; }

#page > * { animation: pageIn .42s var(--ease-out) both; }

 #page > *, .sk { animation: none !important; }

.pl-bar { position: relative; }

.pl-fill { position: relative; }

.pl-fill::after { content: ''; position: absolute; right: -6px; top: 50%; width: 12px; height: 12px; border-radius: 50%; background: #fff; transform: translateY(-50%) scale(0); transition: transform var(--dur-micro); box-shadow: var(--shadow-sm); }

.pl-bar:hover .pl-fill::after { transform: translateY(-50%) scale(1); }
